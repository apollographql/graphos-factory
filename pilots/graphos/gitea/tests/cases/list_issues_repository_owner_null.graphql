# The null-parent case for Gitea_RepositoryMeta.ownerUser: the
# parent stub (list_issues_repository_owner_null.json) returns issue #2 with
# repository.owner = "fixture" beside issue #3 whose repository carries no owner
# (absent, which the spec allows; owner reads null).
# The guarded connector resolves #2 through user.json. For #3 the router still
# sends GET /users/ (the guard maps the answer, it does not skip the
# request); user_empty_segment.json answers it the way Gitea does (404), and the
# guard turns that into a null ownerUser.
query {
  gitea_listIssues(owner: "fixture", repo: "fixture-repo", state: closed, limit: 2) {
    number
    repository {
      id
      name
      owner
      fullName
      ownerUser {
        id
        login
      }
    }
  }
}
