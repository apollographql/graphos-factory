# Two enum arguments and the comma-separated labels filter (D-0006) are
# asserted by the fixture's queryParameters matcher.
query {
  gitea_listIssues(owner: "fixture", repo: "fixture-repo", state: open, type: issues, labels: "bug,enhancement", limit: 10) {
    id
    number
    url
    htmlUrl
    title
    body
    state
    isLocked
    comments
    user {
      id
      login
      loginName
      sourceId
      fullName
      email
      avatarUrl
      htmlUrl
      language
      isAdmin
      lastLogin
      created
      restricted
      active
      prohibitLogin
      location
      website
      description
      visibility
      followersCount
      followingCount
      starredReposCount
    }
    originalAuthor
    originalAuthorId
    assignee {
      id
      login
      loginName
      sourceId
      fullName
      email
      avatarUrl
      htmlUrl
      language
      isAdmin
      lastLogin
      created
      restricted
      active
      prohibitLogin
      location
      website
      description
      visibility
      followersCount
      followingCount
      starredReposCount
    }
    assignees {
      id
      login
      loginName
      sourceId
      fullName
      email
      avatarUrl
      htmlUrl
      language
      isAdmin
      lastLogin
      created
      restricted
      active
      prohibitLogin
      location
      website
      description
      visibility
      followersCount
      followingCount
      starredReposCount
    }
    labels {
      id
      name
      color
      description
      exclusive
      isArchived
      url
    }
    milestone {
      id
      title
      description
      state
      openIssues
      closedIssues
      createdAt
      updatedAt
      closedAt
      dueOn
    }
    assets {
      id
      uuid
      name
      size
      downloadCount
      createdAt
      browserDownloadUrl
    }
    pullRequest {
      draft
      htmlUrl
      merged
      mergedAt
    }
    repository {
      id
      name
      owner
      fullName
    }
    ref
    timeEstimate
    pinOrder
    createdAt
    updatedAt
    closedAt
    dueDate
  }
}
