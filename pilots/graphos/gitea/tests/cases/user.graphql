query {
  gitea_user(username: "fixture") {
    id
    login
    loginName
    sourceId
    fullName
    email
    avatarUrl
    htmlUrl
    language
    isAdmin
    lastLogin
    created
    restricted
    active
    prohibitLogin
    location
    website
    description
    visibility
    followersCount
    followingCount
    starredReposCount
  }
}
