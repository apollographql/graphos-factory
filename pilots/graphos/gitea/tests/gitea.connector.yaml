# rover connector test suite — layer 2 of the validation stack.
#
# Asserts the OUTBOUND request each connector builds (method, URL, headers,
# body) and how a supplied response maps back. It never reaches the network.
# Payloads are the bodies the seeded CI instance really returned (memory.md),
# so every selected key is present and the mapping is asserted on real data.
#
# Two framework behaviours shape this file (memory.md, "Testing gotchas"):
#   * a selected property absent from apiResponseBody is a GraphQL::Problem,
#     so every payload carries every selected key;
#   * every $args scalar reaches the connector as a string, so the write's
#     integer `labels` list is asserted by the e2e case, not here.
#
# The framework injects $config but not $env; scripts/unit.sh rewrites the
# schema's static {$env.GITEA_TOKEN} to {$config.GITEA_TOKEN} in a temporary
# copy, backed by the value below.
config:
  schema: gitea.graphql
  common:
    variables:
      $config:
        GITEA_TOKEN: test-token

tests:
  # ── Queries ──────────────────────────────────────────────────────────────────

  - name: "gitea_version flattens the version envelope"
    target: "Query.gitea_version"
    apiResponseBody: |
      { "version": "1.25.0" }
    expect:
      connectorRequest:
        method: GET
        url: http://127.0.0.1:3000/api/v1/version
        headers:
          authorization: token test-token
      connectorResponse: |
        "1.25.0"

