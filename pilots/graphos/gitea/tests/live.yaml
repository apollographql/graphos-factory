# Live smoke tests against a real Gitea instance.
#
# Credential: GITEA_TOKEN (template.yaml's AUTH_EXPR test_default). Unset
# means live.sh exits 3 and evidence records the layer as `not_run`; it never
# runs with a placeholder. In CI, a fixture script starts a Gitea 1.25.0
# instance on 127.0.0.1:3000, seeds `fixture/fixture-repo` with issue #1 and
# the `bug` label, mints the token for that job only, and exports it — so
# every selected operation runs live here, the write included (D-0008). No
# third party and no shared account are involved.
#
#   scripts/live.sh pilots/graphos/gitea
# Every selected operation is a case below; nothing is excluded. The one
# relationship field, Gitea_RepositoryMeta.ownerUser, has its own case.
#
# Every int64-backed counter is a String in the schema (D-0011), so
# a numeric predicate pipes it through `tonumber` first. Comparing a JSON
# string with `>=` is not an error in jq — it compares as a string and is true
# for every value the API will ever send, which is a green run proving
# nothing. `tonumber` fails loudly on anything that is not a number.
cases:
  - name: version
    safety: read
    require: >
      .data.gitea_version | test("^1\\.25\\.")
  - name: search_repos
    safety: read
    # The seeded repository, with its owner embedded and permissions populated.
    require: >
      .data.gitea_searchRepos
      | .ok == true and (.data | length >= 1)
        and (.data | all(.id != null and .fullName != null and .owner.login != null
                          and .permissions.pull != null and .htmlUrl != null))
        and (.data | any(.fullName == "fixture/fixture-repo"))
  - name: repo
    safety: read
    require: >
      .data.gitea_repo
      | .fullName == "fixture/fixture-repo" and .owner.login == "fixture"
        and .defaultBranch == "main" and .hasIssues == true and (.openIssuesCount | tonumber) >= 1
        and (.topics | type) == "array"
  - name: list_issues
    safety: read
    # The seed leaves issue #1 open; every issue carries its author and repository.
    require: >
      .data.gitea_listIssues
      | (length >= 1)
        and all((.number | tonumber) >= 1 and .title != null and .state == "open"
                and .user.login != null and .repository.fullName == "fixture/fixture-repo")
  - name: issue
    safety: read
    require: >
      .data.gitea_issue
      | (.number | tonumber) == 1 and .title == "First fixture issue" and .state == "open"
        and .user.login == "fixture" and (.labels | type) == "array" and .pullRequest == null
  - name: create_issue
    safety: write   # against the job's own throwaway instance (D-0008)
    # The created issue comes back with the requested title, body and label.
    require: >
      .data.gitea_createIssue
      | .title == "Live smoke" and .body == "Created by tests/live.yaml." and .state == "open"
        and (.number | tonumber) >= 2 and .user.login == "fixture"
        and (.labels | map(.name) | index("bug") != null)
  - name: current_user
    safety: read
    require: >
      .data.gitea_currentUser
      | .login == "fixture" and .isAdmin == true and .active == true and .email != null
  - name: user
    safety: read
    require: >
      .data.gitea_user
      | .login == "fixture" and .id != null and .htmlUrl != null
  - name: issue_repository_owner
    safety: read
    # The relationship field Gitea_RepositoryMeta.ownerUser (D-0017): the
    # router follows repository.owner to get:/users/{username}, and the user it
    # returns is the one the foreign key names.
    require: >
      .data.gitea_issue.repository
      | .owner == "fixture" and .ownerUser != null
        and .ownerUser.login == .owner and .ownerUser.id != null

exclusions: []
