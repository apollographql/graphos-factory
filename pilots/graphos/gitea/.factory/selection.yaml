contract_version: 2
defaults:
  fields: all
  max_depth: 4
  opaque_json_policy: forbid
operations:
  # ── Selected: eight operations across four resources (D-0001) ─────────────
  "get:/version":
    response:
      envelope: "version"
      confirmed: true
    include: true
    graphql: { root: query, name: version }   # flattened to the bare String (D-0002)
  "get:/repos/search":
    response:
      envelope: "data"
      confirmed: true
    include: true
    graphql: { root: query, name: searchRepos }
    fields:
      exclude:
        - "data[]>allow_fast_forward_only_merge"
        - "data[]>allow_manual_merge"
        - "data[]>allow_merge_commits"
        - "data[]>allow_rebase"
        - "data[]>allow_rebase_explicit"
        - "data[]>allow_rebase_update"
        - "data[]>allow_squash_merge"
        - "data[]>autodetect_manual_merge"
        - "data[]>default_allow_maintainer_edit"
        - "data[]>default_delete_branch_after_merge"
        - "data[]>default_merge_style"
        - "data[]>ignore_whitespace_conflicts"
        - "data[]>internal_tracker"
        - "data[]>external_tracker"
        - "data[]>external_wiki"
        - "data[]>repo_transfer"
        - "data[]>parent"
        - "data[]>mirror_interval"
        - "data[]>mirror_updated"
      rename:
        "data[]>full_name": fullName
        "data[]>languages_url": languagesUrl
        "data[]>html_url": htmlUrl
        "data[]>ssh_url": sshUrl
        "data[]>clone_url": cloneUrl
        "data[]>original_url": originalUrl
        "data[]>stars_count": starsCount
        "data[]>forks_count": forksCount
        "data[]>watchers_count": watchersCount
        "data[]>open_issues_count": openIssuesCount
        "data[]>open_pr_counter": openPrCounter
        "data[]>release_counter": releaseCounter
        "data[]>default_branch": defaultBranch
        "data[]>archived_at": archivedAt
        "data[]>created_at": createdAt
        "data[]>updated_at": updatedAt
        "data[]>has_code": hasCode
        "data[]>has_issues": hasIssues
        "data[]>has_wiki": hasWiki
        "data[]>has_pull_requests": hasPullRequests
        "data[]>has_projects": hasProjects
        "data[]>has_releases": hasReleases
        "data[]>has_packages": hasPackages
        "data[]>has_actions": hasActions
        "data[]>projects_mode": projectsMode
        "data[]>avatar_url": avatarUrl
        "data[]>object_format_name": objectFormatName
    pagination: { expose: [page, limit], next_cursor: null }
  "get:/repos/{owner}/{repo}":
    response:
      envelope: null
      confirmed: true
    include: true
    graphql: { root: query, name: repo }
    fields:
      exclude:
        - "allow_fast_forward_only_merge"
        - "allow_manual_merge"
        - "allow_merge_commits"
        - "allow_rebase"
        - "allow_rebase_explicit"
        - "allow_rebase_update"
        - "allow_squash_merge"
        - "autodetect_manual_merge"
        - "default_allow_maintainer_edit"
        - "default_delete_branch_after_merge"
        - "default_merge_style"
        - "ignore_whitespace_conflicts"
        - "internal_tracker"
        - "external_tracker"
        - "external_wiki"
        - "repo_transfer"
        - "parent"
        - "mirror_interval"
        - "mirror_updated"
      rename:
        "full_name": fullName
        "languages_url": languagesUrl
        "html_url": htmlUrl
        "ssh_url": sshUrl
        "clone_url": cloneUrl
        "original_url": originalUrl
        "stars_count": starsCount
        "forks_count": forksCount
        "watchers_count": watchersCount
        "open_issues_count": openIssuesCount
        "open_pr_counter": openPrCounter
        "release_counter": releaseCounter
        "default_branch": defaultBranch
        "archived_at": archivedAt
        "created_at": createdAt
        "updated_at": updatedAt
        "has_code": hasCode
        "has_issues": hasIssues
        "has_wiki": hasWiki
        "has_pull_requests": hasPullRequests
        "has_projects": hasProjects
        "has_releases": hasReleases
        "has_packages": hasPackages
        "has_actions": hasActions
        "projects_mode": projectsMode
        "avatar_url": avatarUrl
        "object_format_name": objectFormatName
  "get:/repos/{owner}/{repo}/issues":
    response:
      envelope: null
      confirmed: true
    include: true
    graphql: { root: query, name: listIssues }
    fields:
      rename:
        "[]>html_url": htmlUrl
        "[]>is_locked": isLocked
        "[]>original_author": originalAuthor
        "[]>original_author_id": originalAuthorId
        "[]>pull_request": pullRequest
        "[]>time_estimate": timeEstimate
        "[]>pin_order": pinOrder
        "[]>created_at": createdAt
        "[]>updated_at": updatedAt
        "[]>closed_at": closedAt
        "[]>due_date": dueDate
    pagination: { expose: [page, limit], next_cursor: null }
  "get:/repos/{owner}/{repo}/issues/{index}":
    response:
      envelope: null
      confirmed: true
    include: true
    graphql: { root: query, name: issue }
    fields:
      rename:
        "html_url": htmlUrl
        "is_locked": isLocked
        "original_author": originalAuthor
        "original_author_id": originalAuthorId
        "pull_request": pullRequest
        "time_estimate": timeEstimate
        "pin_order": pinOrder
        "created_at": createdAt
        "updated_at": updatedAt
        "closed_at": closedAt
        "due_date": dueDate
  "post:/repos/{owner}/{repo}/issues":
    response:
      envelope: null
      confirmed: true
    include: true
    graphql: { root: mutation, name: createIssue }   # a genuine write (D-0007)
    tags: [write]
    fields:
      rename:
        "html_url": htmlUrl
        "is_locked": isLocked
        "original_author": originalAuthor
        "original_author_id": originalAuthorId
        "pull_request": pullRequest
        "time_estimate": timeEstimate
        "pin_order": pinOrder
        "created_at": createdAt
        "updated_at": updatedAt
        "closed_at": closedAt
        "due_date": dueDate
  "get:/user":
    response:
      envelope: null
      confirmed: true
    include: true
    graphql: { root: query, name: currentUser }
    fields:
      rename:
        "login_name": loginName
        "source_id": sourceId
        "full_name": fullName
        "avatar_url": avatarUrl
        "html_url": htmlUrl
        "is_admin": isAdmin
        "last_login": lastLogin
        "prohibit_login": prohibitLogin
        "followers_count": followersCount
        "following_count": followingCount
        "starred_repos_count": starredReposCount
  "get:/users/{username}":
    response:
      envelope: null
      confirmed: true
    include: true
    graphql: { root: query, name: user }
    fields:
      rename:
        "login_name": loginName
        "source_id": sourceId
        "full_name": fullName
        "avatar_url": avatarUrl
        "html_url": htmlUrl
        "is_admin": isAdmin
        "last_login": lastLogin
        "prohibit_login": prohibitLogin
        "followers_count": followersCount
        "following_count": followingCount
        "starred_repos_count": starredReposCount

