# Conformance gaps accepted by `factory codify --waive`: bodies the oracle could
# not judge (unchecked) or could not match (unmatched), each with its reason and decision.
waivers:
  - where: tests/fixtures/mappings/repo_not_found.json
    status: unchecked
    reason: "Gitea documents no 404 body for this route; the fixture carries the body observed live on 2026-09-10 and the e2e case asserts the error mapping (D-0004)."
    decision: D-0010
    until: "Gitea documents the notFound response body"
  - where: tests/fixtures/mappings/create_issue_invalid.json
    status: unchecked
    reason: "Gitea documents no 422 body for issue creation; the fixture carries the validation error observed live on 2026-09-10 and the e2e case asserts the mapping (D-0004)."
    decision: D-0010
    until: "Gitea documents the validationError response body"
  - where: tests/fixtures/mappings/user_empty_segment.json
    status: unmatched
    reason: "The empty-segment GET /users/ the router sends for a null owner; the null guard maps the answer to a null ownerUser but does not skip the request (ADR 0084). No operation describes it. The body is what the seeded Gitea 1.25.0 answered with curl on 2026-09-30 (404, text/plain) (D-0018)."
    decision: D-0018
    until: "never: a null owner always sends this request, and no spec operation describes an empty segment"
# ── Relationship fields (ADR 0069) ────────────────────────────────────────
# RepositoryMeta.owner is the owner's login; the inventory's fact matched it
# to get:/packages/{owner} (a list route), so the entry names the by-id read
# it actually keys (D-0017). Since ADR 0085 no fact backs it at all: Gitea's
# User spells the key `login`, so inventory links refuses get:/users/{username}.
# The entry is a judgement, kept with a null guard (D-0018).
links:
  - shape: RepositoryMeta
    path: owner
    operation: "get:/users/{username}"
    parameter: username
    field: ownerUser
    include: true
    confirmed: true
    reason: "owner is the login GET /users/{username} keys; the user it returns has login == owner (live case). No fact backs it since ADR 0085, whose rule looks for `username` in a response that spells it `login` (D-0017, D-0018)."
    decision: D-0018
  - shape: Organization
    path: username
    operation: "get:/users/{username}"
    parameter: username
    field: user
    include: false
    confirmed: true
    reason: "no host: Organization is reached only through Repository.repo_transfer, which the selection excludes, and the name is the organisation's own (D-0017)"
    decision: D-0017
