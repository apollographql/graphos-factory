name: release

# Publishes a graphos-factory release: the product (the skill and the plugin,
# versioned by .claude-plugin/plugin.json) and the graphos-factory binary
# built from the same commit, which skills/graphos-factory/scripts/bootstrap.sh
# downloads through the core's bootstrap.sh
# (graphos-factory-<tag>-<target>.tar.gz; the skill's release.env names the
# tag). The product and the binary are versioned apart: the binary's version
# is crate/Cargo.toml's, and a release whose skill text alone changed
# carries the same binary version as the one before. Two channels:
#
#   edge      every push to main rebuilds the single `edge` pre-release: the
#             tag `edge` is moved to the commit, the previous pre-release is
#             replaced, and the four platform archives are uploaded. This is
#             the channel bootstrap.sh falls back to when the release its
#             release.env names has no asset for the platform yet.
#   release   a tag v<version> (which must equal .claude-plugin/plugin.json's
#             version), pushed by the mirror when a product version reaches
#             main, or created by a manual dispatch with `version`. After the
#             assets, the skills job opens a pull request on
#             apollographql/skills that releases it there: the copy of the
#             skill its apollo-skills plugin carries, and that plugin's
#             version (it needs the SKILLS_MARKETPLACE_TOKEN secret: a token
#             that can push a branch to that repository and open a pull
#             request; without it the job says so and does nothing).
#
# Every repository reference is ${{ github.repository }}, so the same file
# releases from whichever repository it runs in.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Cut a versioned release v<version> at this ref (must equal .claude-plugin/plugin.json). Leave empty to rebuild the edge pre-release."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      channel: ${{ steps.tag.outputs.channel }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Resolve the channel and tag
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          product_version="$(jq -r .version .claude-plugin/plugin.json)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"; channel=release
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${INPUT_VERSION}" ]; then
            tag="v${INPUT_VERSION}"; channel=release
          else
            tag=edge; channel=edge
          fi
          if [ "$channel" = release ] && [ "$tag" != "v$product_version" ]; then
            echo "tag $tag != the product version v$product_version (.claude-plugin/plugin.json)" >&2; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Point the tag at this commit
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          CHANNEL: ${{ steps.tag.outputs.channel }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "$CHANNEL" = edge ]; then
            git tag -f edge
            git push -f origin refs/tags/edge
          elif ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "graphos-factory ${TAG#v}"
            git push origin "refs/tags/$TAG"
          else
            echo "tag $TAG already exists on origin; releasing it as is"
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          CHANNEL: ${{ steps.tag.outputs.channel }}
        run: |
          if [ "$CHANNEL" = edge ]; then
            # Replace the previous edge pre-release wholesale so its assets
            # never mix with this build's.
            gh release delete edge --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
            gh release create edge --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
              --title "edge: main @ ${GITHUB_SHA::7}" \
              --notes "Rolling pre-release built from main at ${GITHUB_SHA} ($(date -u +%Y-%m-%dT%H:%M:%SZ)). Not a versioned release: skills/graphos-factory/scripts/bootstrap.sh installs it when the release its release.env names has no asset for the platform. Replaced on every push to main."
          elif gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists (a re-run after a partial upload); keeping it"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "graphos-factory ${TAG#v}" --generate-notes
          fi

  upload-assets:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          # Both Apple targets build on the Apple Silicon runner; Apple's
          # toolchain cross-compiles x86_64, and GitHub retired the Intel
          # `macos-13` image (a job labelled with it never gets a runner).
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: graphos-factory
          manifest-path: crate/Cargo.toml
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # Release to Apollo's skills repository (apollographql/skills), as a pull
  # request that a person reviews and merges: the read-only copy of the skill
  # its apollo-skills plugin carries under skills/graphos-factory/ becomes
  # this release's, and that plugin's version gets a patch bump
  # (.github/scripts/release-to-skills.sh). Re-running it for the same tag
  # updates the same branch.
  skills:
    needs: [prepare, upload-assets]
    if: needs.prepare.outputs.channel == 'release'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ secrets.SKILLS_MARKETPLACE_TOKEN }}
      SKILLS_REPO: apollographql/skills
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          path: release
      - name: Open the skills repository pull request
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::SKILLS_MARKETPLACE_TOKEN is not set: release $TAG to $SKILLS_REPO by hand (release/.github/scripts/release-to-skills.sh does the edit)."
            exit 0
          fi
          branch="graphos-factory/release-$TAG"
          gh repo clone "$SKILLS_REPO" skills -- --depth 1
          # An assignment, not a test: a failing script fails the step here.
          result="$(bash release/.github/scripts/release-to-skills.sh release skills)"
          if [ "$result" = unchanged ]; then
            echo "$SKILLS_REPO already holds graphos-factory $TAG"; exit 0
          fi
          cd skills
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --global credential.helper '!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f'
          git checkout -b "$branch"
          git add -A
          git commit -m "Release graphos-factory ${TAG#v}"
          git push -f origin "$branch"
          if [ -n "$(gh pr list --repo "$SKILLS_REPO" --head "$branch" --json number --jq '.[].number')" ]; then
            echo "the pull request for $branch already exists; its branch is updated"
          else
            gh pr create --repo "$SKILLS_REPO" --head "$branch" \
              --title "Release graphos-factory ${TAG#v}" \
              --body "Releases [graphos-factory \`$TAG\`](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG) here: \`skills/graphos-factory/\` becomes that release's skill (the protect check compares it with the tag), and the \`apollo-skills\` plugin version gets a patch bump. Opened by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
          fi
